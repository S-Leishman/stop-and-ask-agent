<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="ui-monospace,Menlo,Consolas,monospace">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#58a6ff" stroke-width="1.5"/></marker>
  </defs>
  <rect width="960" height="560" fill="#0d1117"/>
  <text x="30" y="40" fill="#e6edf3" font-size="18" font-weight="bold">Stop-and-Ask Agent — authority flows down; nothing flows back up but the decision</text>

  <rect x="30" y="70" width="240" height="64" rx="8" fill="#161b22" stroke="#58a6ff"/>
  <text x="150" y="96" fill="#58a6ff" font-size="14" text-anchor="middle" font-weight="bold">HUMAN PRINCIPAL</text>
  <text x="150" y="116" fill="#8b949e" font-size="11" text-anchor="middle">grants a standing envelope ONCE</text>

  <rect x="30" y="170" width="240" height="64" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="150" y="196" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">CHILD AGENT ENVELOPE</text>
  <text x="150" y="216" fill="#8b949e" font-size="11" text-anchor="middle">monotonic narrowing: no write right</text>

  <rect x="30" y="270" width="240" height="64" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="150" y="296" fill="#e6edf3" font-size="13" text-anchor="middle" font-weight="bold">STRANDS AGENT</text>
  <text x="150" y="316" fill="#8b949e" font-size="11" text-anchor="middle">reads brief · drafts output (autonomous)</text>

  <rect x="30" y="370" width="240" height="64" rx="8" fill="#251d0e" stroke="#d29922"/>
  <text x="150" y="396" fill="#d29922" font-size="13" text-anchor="middle" font-weight="bold">AUTHORITY GATE (code)</text>
  <text x="150" y="416" fill="#8b949e" font-size="11" text-anchor="middle">effect ceiling → REQUIRES_HUMAN</text>

  <rect x="380" y="370" width="220" height="64" rx="8" fill="#161b22" stroke="#d29922"/>
  <text x="490" y="396" fill="#ffa657" font-size="13" text-anchor="middle" font-weight="bold">HUMAN DECISION</text>
  <text x="490" y="416" fill="#8b949e" font-size="11" text-anchor="middle">one screen: APPROVE / DENY</text>

  <rect x="700" y="370" width="230" height="64" rx="8" fill="#161b22" stroke="#238636"/>
  <text x="815" y="396" fill="#7ee787" font-size="13" text-anchor="middle" font-weight="bold">EFFECT COMMITTED</text>
  <text x="815" y="416" fill="#8b949e" font-size="11" text-anchor="middle">only after APPROVE</text>

  <rect x="700" y="470" width="230" height="56" rx="8" fill="#161b22" stroke="#238636"/>
  <text x="815" y="493" fill="#7ee787" font-size="13" text-anchor="middle" font-weight="bold">SIGNED RECEIPT CHAIN</text>
  <text x="815" y="512" fill="#8b949e" font-size="11" text-anchor="middle">Ed25519 + sha256 links → replay verifies</text>

  <line x1="150" y1="134" x2="150" y2="164" stroke="#58a6ff" marker-end="url(#a)"/>
  <text x="160" y="155" fill="#58a6ff" font-size="10">authority</text>
  <line x1="150" y1="234" x2="150" y2="264" stroke="#58a6ff" marker-end="url(#a)"/>
  <line x1="150" y1="334" x2="150" y2="364" stroke="#d29922" marker-end="url(#a)"/>
  <text x="162" y="355" fill="#d29922" font-size="10">COMMIT_OUTPUT outside envelope → STOP</text>
  <line x1="270" y1="402" x2="374" y2="402" stroke="#d29922" marker-end="url(#a)"/>
  <text x="300" y="392" fill="#8b949e" font-size="10">asks</text>
  <line x1="600" y1="402" x2="694" y2="402" stroke="#238636" marker-end="url(#a)"/>
  <text x="612" y="392" fill="#8b949e" font-size="10">APPROVE</text>
  <line x1="815" y1="434" x2="815" y2="464" stroke="#238636" marker-end="url(#a)"/>
  <line x1="490" y1="434" x2="490" y2="470" stroke="#b62324"/>
  <text x="500" y="460" fill="#8b949e" font-size="10">DENY → receipted, never silent</text>

  <rect x="380" y="90" width="550" height="230" rx="8" fill="#010409" stroke="#30363d"/>
  <text x="404" y="120" fill="#e6edf3" font-size="13" font-weight="bold">The invariant</text>
  <text x="404" y="150" fill="#7ee787" font-size="12">The agent is allowed to work.</text>
  <text x="404" y="174" fill="#7ee787" font-size="12">It is not allowed to commit beyond its envelope.</text>
  <text x="404" y="198" fill="#7ee787" font-size="12">When it reaches the effect ceiling, execution stops.</text>
  <text x="404" y="222" fill="#7ee787" font-size="12">A human decides.</text>
  <text x="404" y="246" fill="#7ee787" font-size="12">Whatever happens next is signed and replayable.</text>
  <text x="404" y="286" fill="#8b949e" font-size="11">The authority decision is deterministic code. The model proposes;</text>
  <text x="404" y="304" fill="#8b949e" font-size="11">it never grants itself permission.</text>
</svg>
